<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#00d4c0" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00d4c0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#00d4c0" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#00d4c0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0b0b12"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- ── LEFT COLUMN ── -->

  <!-- Extension badge pill -->
  <rect x="80" y="80" width="290" height="36" rx="18" fill="#00d4c020" stroke="#00d4c040" stroke-width="1.5"/>
  <circle cx="105" cy="98" r="5" fill="#00d4c0"/>
  <text x="120" y="103" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="600" fill="#00d4c0" letter-spacing="1.5">BROWSER EXTENSION</text>

  <!-- Headline -->
  <text x="80" y="210" font-family="ui-sans-serif,system-ui,sans-serif" font-size="72" font-weight="800" fill="#ffffff" letter-spacing="-2">See Where Every</text>
  <text x="80" y="298" font-family="ui-sans-serif,system-ui,sans-serif" font-size="72" font-weight="800" fill="#00d4c0" letter-spacing="-2">X Profile Is From</text>

  <!-- Description -->
  <text x="80" y="360" font-family="ui-sans-serif,system-ui,sans-serif" font-size="24" fill="#ffffff" opacity="0.55">Hover any profile and instantly see their</text>
  <text x="80" y="392" font-family="ui-sans-serif,system-ui,sans-serif" font-size="24" fill="#ffffff" opacity="0.55">real country — powered by X's own data.</text>

  <!-- Feature pills -->
  <rect x="80"  y="440" width="126" height="34" rx="17" fill="#ef444420" stroke="#ef444450" stroke-width="1.5"/>
  <text x="143" y="462" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="700" fill="#ef4444" text-anchor="middle">&#9888; VPN detect</text>

  <rect x="218" y="440" width="134" height="34" rx="17" fill="#a855f720" stroke="#a855f750" stroke-width="1.5"/>
  <text x="285" y="462" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="700" fill="#a855f7" text-anchor="middle">Mobile source</text>

  <rect x="364" y="440" width="148" height="34" rx="17" fill="#00d4c020" stroke="#00d4c050" stroke-width="1.5"/>
  <text x="438" y="462" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="700" fill="#00d4c0" text-anchor="middle">Country blocking</text>

  <!-- Bottom URL -->
  <text x="80" y="570" font-family="ui-sans-serif,system-ui,sans-serif" font-size="18" font-weight="700" fill="#ffffff" opacity="0.30">x-profile-location.pages.dev</text>

  <!-- ── RIGHT COLUMN — hover card mockup ── -->

  <!-- Card glow -->
  <rect x="740" y="95" width="384" height="434" rx="24" fill="#00d4c0" opacity="0.05"/>

  <!-- Card body -->
  <rect x="750" y="85" width="384" height="444" rx="20" fill="#131320" stroke="#00d4c040" stroke-width="1.5"/>

  <!-- Browser chrome bar -->
  <rect x="750" y="85" width="384" height="50" rx="20" fill="#0f0f1c"/>
  <rect x="750" y="110" width="384" height="25" fill="#0f0f1c"/>
  <circle cx="780" cy="110" r="5" fill="#ff5f5780"/>
  <circle cx="800" cy="110" r="5" fill="#febc2e80"/>
  <circle cx="820" cy="110" r="5" fill="#28c84080"/>
  <rect x="840" y="100" width="170" height="18" rx="9" fill="#ffffff10"/>
  <text x="925" y="113" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#ffffff30" text-anchor="middle">x.com/profile</text>

  <!-- ── Row 1: Germany ── -->
  <rect x="774" y="154" width="336" height="90" rx="12" fill="#ffffff06" stroke="#ffffff0f" stroke-width="1"/>
  <circle cx="806" cy="199" r="22" fill="#00d4c018"/>
  <!-- Avatar lines -->
  <rect x="838" y="183" width="104" height="10" rx="5" fill="#ffffff45"/>
  <rect x="838" y="201" width="72" height="8"  rx="4" fill="#ffffff22"/>
  <!-- Country badge: DE -->
  <rect x="838" y="218" width="34" height="20" rx="5" fill="#3b82f6"/>
  <text x="855" y="232" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">DE</text>
  <text x="880" y="232" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#ffffff70">Germany</text>

  <!-- ── Row 2: US + VPN ── -->
  <rect x="774" y="258" width="336" height="90" rx="12" fill="#ffffff06" stroke="#ffffff0f" stroke-width="1"/>
  <circle cx="806" cy="303" r="22" fill="#ffffff12"/>
  <rect x="838" y="287" width="110" height="10" rx="5" fill="#ffffff45"/>
  <rect x="838" y="305" width="76" height="8"  rx="4" fill="#ffffff22"/>
  <!-- Country badge: US -->
  <rect x="838" y="322" width="34" height="20" rx="5" fill="#3b82f6"/>
  <text x="855" y="336" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">US</text>
  <!-- VPN badge -->
  <rect x="880" y="322" width="68" height="20" rx="5" fill="#ef444420" stroke="#ef444460" stroke-width="1"/>
  <text x="914" y="336" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="700" fill="#ef4444" text-anchor="middle">&#9888; VPN</text>

  <!-- ── Row 3: Japan + Mobile ── -->
  <rect x="774" y="362" width="336" height="90" rx="12" fill="#ffffff06" stroke="#ffffff0f" stroke-width="1"/>
  <circle cx="806" cy="407" r="22" fill="#ffffff12"/>
  <rect x="838" y="391" width="92" height="10" rx="5" fill="#ffffff45"/>
  <rect x="838" y="409" width="62" height="8"  rx="4" fill="#ffffff22"/>
  <!-- Country badge: JP -->
  <rect x="838" y="426" width="34" height="20" rx="5" fill="#3b82f6"/>
  <text x="855" y="440" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">JP</text>
  <text x="880" y="440" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#ffffff70">Japan</text>
  <!-- Mobile badge -->
  <rect x="930" y="426" width="66" height="20" rx="5" fill="#a855f720" stroke="#a855f760" stroke-width="1"/>
  <text x="963" y="440" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="700" fill="#a855f7" text-anchor="middle">Mobile</text>

  <!-- Card label -->
  <text x="934" y="502" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="600" fill="#00d4c0" opacity="0.45" letter-spacing="1.5" text-anchor="middle">X PROFILE LOCATION</text>
</svg>
