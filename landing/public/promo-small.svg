  <rect x="162" y="214" width="116" height="28" rx="14" fill="#a855f720" stroke="#a855f750" stroke-width="1"/>
  <text x="220" y="232" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="700" fill="#a855f7" text-anchor="middle">Mobile source</text>

  <rect x="290" y="214" width="106" height="28" rx="14" fill="#00d4c020" stroke="#00d4c050" stroke-width="1"/>
  <text x="343" y="232" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="700" fill="#00d4c0" text-anchor="middle">Blocking</text>

