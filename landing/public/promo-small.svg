  <rect width="440" height="280" fill="url(#glow2)"/>

  <!-- Headline -->
  <text x="220" y="95" font-family="ui-sans-serif,system-ui,sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="-1" text-anchor="middle">See Where Every</text>
  <text x="220" y="136" font-family="ui-sans-serif,system-ui,sans-serif" font-size="34" font-weight="800" fill="#00d4c0" letter-spacing="-1" text-anchor="middle">X Profile Is From</text>

  <!-- Description -->
  <text x="220" y="170" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#ffffff" opacity="0.55" text-anchor="middle">Hover any profile — see their real country,</text>
  <text x="220" y="188" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#ffffff" opacity="0.55" text-anchor="middle">powered by X's own data.</text>

