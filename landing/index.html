<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b12" />
    <!-- description / keywords / OG / Twitter / canonical all come from
         src/seo.ts via the prerender plugin. Declaring a description here too
         put two <meta name="description"> tags in every built page. -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link
      rel="preload"
      href="/fonts/archivo-latin-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>X-Pat — X Profile Location: see the country of any X profile</title>
    <script>
      // Language preference. Inline and first in the head so it runs before
      // anything paints — a redirect after first paint is a visible flash.
      //
      // Only an *explicit* choice ever redirects: a language picked from the
      // menu, remembered here and applied to the bare English homepage on the
      // next visit. Detecting one from the browser's language list used to
      // redirect too, and no longer does — Google's guidance is that
      // auto-redirecting between language versions keeps crawlers (and
      // people) from reaching the others, and the site lost its index
      // admission while it did. `LanguageSuggest.tsx` offers the detected
      // language as a link instead. The picker's English entry carries
      // `#hl=en` precisely so "English" is expressible as a preference rather
      // than as the absence of one.
      //
      // Only `/` is ever redirected. A deep link, a shared URL and every
      // hreflang alternate resolve to exactly what they say.
      ;(function () {
        var CODES = '%LOCALE_CODES%'.split(',')
        var KEY = '%LANG_KEY%'
        var store
        try {
          store = localStorage
        } catch (e) {
          return // Private mode with storage denied: leave the page alone.
        }

        // Arriving from the picker's English entry is an explicit choice.
        if (location.hash === '#hl=en') {
          store.setItem(KEY, 'en')
          history.replaceState(null, '', location.pathname + location.search)
          return
        }

        var first = location.pathname.split('/')[1]
        if (CODES.indexOf(first) > -1) {
          store.setItem(KEY, first) // On /ja/… — remember that.
          return
        }
        if (location.pathname !== '/') return

        var saved = store.getItem(KEY)
        if (saved && saved !== 'en') location.replace('/' + saved)
      })()
    </script>
    <script>
      // `<details>` has no light dismiss of its own: the language menu stays
      // open until its summary is clicked a second time. Inline here rather
      // than as an effect in the component because hydration waits for idle,
      // and a menu that cannot be dismissed for the first second is worse than
      // one that never opened.
      ;(function () {
        var openMenu = function () {
          return document.querySelector('details[data-light-dismiss][open]')
        }
        document.addEventListener('pointerdown', function (e) {
          var el = openMenu()
          if (el && !el.contains(e.target)) el.open = false
        })
        document.addEventListener('keydown', function (e) {
          if (e.key !== 'Escape') return
          var el = openMenu()
          if (el) el.open = false
        })
      })()
    </script>
    <script>
      // gtag is ~87 kB, two thirds of it unused, and it blocks nothing that
      // matters — so it waits for idle rather than competing with the font and
      // the stylesheet for bandwidth during first paint.
      //
      // The id guard matters: with VITE_GA_MEASUREMENT_ID unset (every local
      // build, since landing/.env leaves it empty) this used to request
      // `gtag/js?id=` and pull the whole payload down for a property that does
      // not exist.
      var GA_ID = '%VITE_GA_MEASUREMENT_ID%'
      if (GA_ID && GA_ID.indexOf('VITE_') === -1) {
        window.dataLayer = window.dataLayer || []
        window.gtag = function () {
          dataLayer.push(arguments)
        }
        gtag('js', new Date())
        gtag('config', GA_ID)
        addEventListener('load', function () {
          var load = function () {
            var s = document.createElement('script')
            s.async = true
            s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID
            document.head.appendChild(s)
          }
          'requestIdleCallback' in window
            ? requestIdleCallback(load, { timeout: 4000 })
            : setTimeout(load, 2000)
        })
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <!-- No `prerender` attribute: the build-time entry is `src/prerender.tsx`,
         named in vite.config.ts, so that the client graph never reaches the
         dictionary registry. This script is hydration only. -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
