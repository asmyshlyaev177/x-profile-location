name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Unit tests
        run: pnpm test

      - name: Build extension
        run: pnpm build

      # E2E (Playwright) runs locally, not in CI: it needs a logged-in X
      # session and recorded fixtures that drift with X's UI. Run it with
      # `pnpm test:e2e` in the distrobox container before a release.
