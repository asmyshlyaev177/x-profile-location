name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The extension. `landing/` is the `audits` job below.
  extension:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by commit SHA — a tag is repointable by its owner and
      # these steps hold the repo and the runner's token. Keep the trailing tag
      # comment in step when bumping:
      #   gh api repos/actions/checkout/commits/v7.0.1 --jq .sha
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10

      # `cache: pnpm` needs pnpm on PATH, hence the step order.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      # Fails if a committed recording holds a real handle no test names. First,
      # because an unscrubbed capture is a privacy incident, not a broken build.
      - name: Recordings are scrubbed
        run: pnpm scrub:check

      - name: Unit tests
        run: pnpm test

      # Same tests, random order: both suites keep module-level state one test
      # can leave for the next. If this step fails alone, the seed it prints
      # reproduces it: `npx vitest run --sequence.shuffle --sequence.seed=<seed>`.
      - name: Unit tests (random order)
        run: pnpm test:shuffle

      # Uncached on purpose: the slowest step here, but a stale-cache failure in
      # a suite that exists to catch layout regressions costs more than it saves.
      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      # Layout facts (boxes, computed styles), never pixel diffs — a screenshot
      # baseline fails on any runner whose fonts differ. Keep it runner-
      # independent or this step stops being trustworthy. happy-dom has no
      # layout engine, so none of this is reachable from the unit suite.
      - name: Visual tests
        run: pnpm test:visual

      - name: Upload visual test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Build extension
        run: pnpm build

      # Two real x.com tabs, the built extension, the browser's MV3 worker —
      # everything the lookup broker does is a property of more than one tab.
      # After the build: the suite loads dist/chrome. x.com is stubbed at its
      # own URLs (integration/x-stub.ts), so no session and no recordings.
      - name: Cross-context tests
        run: pnpm test:integration

      - name: Upload integration test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

      # E2E runs locally, not here: it needs a logged-in X session and recorded
      # fixtures that drift with X's UI. `pnpm test:e2e` before a release.
      #
      # ⚠ The session cannot be faked. X's SPA decides client-side whether it is
      # logged in before issuing anything, so invented cookies take a boot path
      # the recordings don't hold — 96 unmatched requests against 24. A real
      # session in Actions secrets would be unavailable to fork PRs and would
      # expire on X's schedule. Don't re-attempt the shortcut.

  # The landing site. A job of its own because performance is a timing
  # measurement and must not share a runner with the suites above. Unfiltered on
  # purpose — see landing/CLAUDE.md before adding a `paths:` filter back.
  audits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      # Token contract, contrast, Lighthouse. The build is the suite's own
      # webServer step. If performance flakes here while holding locally, lower
      # that one threshold in the spec — the other three are deterministic and
      # are why this job exists.
      - name: Token contract, contrast and Lighthouse
        run: pnpm test:audits

      - name: Upload audit results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: audit-results
          path: landing/test-results/
          retention-days: 7
          if-no-files-found: ignore
