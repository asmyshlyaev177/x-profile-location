name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      # Every action is pinned to a **commit SHA**, with the tag it came from in
      # the trailing comment. A tag is a movable pointer the action's owner can
      # repoint at any time, so `@v4` is a promise to run whatever that account
      # publishes next — and these steps hold a checkout of this repo and the
      # runner's token. A SHA is the only reference that cannot be changed under
      # us.
      #
      # The comment is the only thing that says which version a SHA is, so keep
      # the two in step when bumping. Resolve a tag with:
      #   gh api repos/actions/checkout/commits/v7.0.1 --jq .sha
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10

      # `cache: pnpm` needs pnpm already on PATH, which is why the step above
      # comes first. setup-node v6 limited *automatic* caching to npm; passing
      # `cache` explicitly is unaffected and pnpm is still a supported value.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      # Fails if any committed recording still contains a real handle that no
      # test names. Runs before anything slower, because a capture landing
      # unscrubbed is a privacy incident rather than a broken build — and by the
      # time it is on a public branch it is already too late to fix quietly.
      - name: Recordings are scrubbed
        run: pnpm scrub:check

      - name: Unit tests
        run: pnpm test

      # Same tests, random order. Both suites keep module-level state (content.tsx
      # settings, page-script's per-instance user buffer) that a test can mutate
      # and the next test inherits — the kind of coupling that passes forever in
      # declaration order and then fails once on someone else's machine. Running
      # shuffled makes that a build failure here rather than a mystery in a
      # contributor's first PR. If this step fails alone, the seed it prints
      # reproduces it: `npx vitest run --sequence.shuffle --sequence.seed=<seed>`.
      - name: Unit tests (random order)
        run: pnpm test:shuffle

      # Layout tests for the UI the content script injects. Unlike the e2e suite
      # below, this one needs no session and no recordings — hardcoded fixture
      # DOM, the extension's own stylesheet over it (imported from
      # src/scripts/styles.ts, so it is the shipped CSS and not a copy), and
      # assertions about how a real browser laid it out. happy-dom has no layout
      # engine, so none of it is reachable from the unit suite: it reports no
      # boxes, resolves no cascade, and has neither the CSS Custom Highlight API
      # nor a working ::highlight().
      #
      # Only chromium is downloaded — the config runs one project. The install
      # is deliberately uncached: it is the slowest step here by far, but a
      # stale-cache failure in a suite that exists to catch layout regressions
      # would cost more attention than the download saves.
      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      # Assertions are layout facts (boxes, computed styles), never pixel
      # diffs — a screenshot baseline compares font rendering as much as
      # layout, so it fails on any runner whose fonts differ from the author's
      # and teaches everyone to re-baseline without looking. Keep it that way;
      # this step is only trustworthy while it stays runner-independent.
      - name: Visual tests
        run: pnpm test:visual

      # Playwright writes an error context (DOM snapshot, resolved styles) per
      # failure. A layout failure that only reproduces on the runner is exactly
      # the case where that is worth having.
      - name: Upload visual test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Build extension
        run: pnpm build

      # E2E (Playwright) runs locally, not in CI: it needs a logged-in X
      # session and recorded fixtures that drift with X's UI. Run it with
      # `pnpm test:e2e` in the distrobox container before a release.
      #
      # The session requirement is not avoidable by faking it, which is less
      # obvious than it sounds and was measured: replay answers X's *responses*
      # from the HARs, but X's SPA decides on the client whether it is logged in
      # before issuing anything, and invented cookies send it down a third boot
      # path that asks for endpoints the recordings don't hold — 96 unmatched
      # requests against 24 for a real session, and the app shell never renders.
      # Putting a real session in Actions secrets would leave it unavailable to
      # fork PRs and expiring on X's schedule. Don't re-attempt the shortcut.
