# Cloudflare Worker config for the shared location cache.
#
# First-time setup:
#   1. cd server && pnpm install   (or npm install)
#   2. pnpm db:create              -> prints a database_id; paste it below
#   3. pnpm db:init                -> applies schema.sql to the remote D1
#   4. pnpm deploy                 -> prints the Worker URL
#   5. point the extension at it — a build-time variable, not a source edit:
#      VITE_CACHE_API_BASE=<that URL> pnpm build   (see pnpm build:worker)
name = "x-loc-cache"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Free-plan friendly: no queues, no durable objects. One cron trigger (below)
# for retention cleanup — cron triggers are included on the Workers free plan.
[[d1_databases]]
binding = "DB"
database_name = "x-loc-cache"
database_id = "b4afee9f-c8b4-4496-b3a5-6431e48c2ffd"

# Weekly (Monday 03:00 UTC): delete location_votes older than 60 days so the
# table doesn't grow unbounded (D1 has no auto-eviction). Weekly rather than
# daily keeps the cleanup's full-table scan off the read budget most days.
# See scheduled() in src/index.ts.
[triggers]
crons = ["0 3 * * 1"]
